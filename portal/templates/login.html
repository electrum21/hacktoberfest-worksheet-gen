{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  {% if problem %}<div class="notice notice--error" role="alert">{{ problem }}</div>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    {{ csrf_field() }}
    <label class="field">Email
      <input type="email" name="email" value="{{ email }}" required autocomplete="email">
    </label>
    <label class="field">Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted" style="margin-top:1rem">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
